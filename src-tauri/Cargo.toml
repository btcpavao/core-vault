[package]
name = "core-vault-ui"
version = "0.1.0"
description = "Local Bitcoin Core Signet multisig UI"
authors = ["Core Vault contributors"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
getrandom = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "1.8", features = ["dialog-ask", "dialog-open", "dialog-save"] }
thiserror = "1"
zeroize = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
